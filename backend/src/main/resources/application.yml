spring:
  application:
    name: financial-control-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/financial_control}
    username: ${DB_USERNAME:financial_user}
    password: ${DB_PASSWORD:financial_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
