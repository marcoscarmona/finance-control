version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: financial_control_db
    environment:
      POSTGRES_DB: financial_control
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_control"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: financial_control_postgres_data
