services:
  postgres:
    image: postgres:16
    container_name: financial_control_db
    environment:
      POSTGRES_DB: financial_control
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: financial_control_api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financial_control
      DB_USERNAME: financial_user
      DB_PASSWORD: financial_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: financial_control_postgres_data
